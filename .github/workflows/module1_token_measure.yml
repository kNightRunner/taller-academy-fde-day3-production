name: Module 1 token counting (isolated branch)
on:
  push:
    branches: [module1-token-lab-measure]
    paths:
      - '.github/workflows/module1_token_measure.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual tokenizer
        run: python -m pip install tiktoken
      - name: Count five samples using o200k_base
        working-directory: tokenlab
        run: |
          python - <<'PY'
          import json, math, tiktoken
          from pathlib import Path
          root=Path('.')
          samples=[
            ('One-line prompt (actual request)', 'samples/prompt.txt'),
            ('English prose', 'samples/english_paragraph.txt'),
            ('Spanish translation', 'samples/spanish_paragraph.txt'),
            ('201-line Python source', 'samples/source_201_lines.py'),
            ('JSONL code/log record', 'samples/log_comparable_size.jsonl'),
          ]
          enc=tiktoken.get_encoding('o200k_base')
          rows=[]
          for label,path in samples:
              data=(root/path).read_text(encoding='utf-8')
              chars=len(data)
              predicted=math.ceil(chars/4)
              counted=len(enc.encode(data))
              rows.append({'content':label,'file':path,'characters':chars,'predicted_tokens':predicted,'counted_tokens':counted,'ratio_counted_predicted':round(counted/predicted,4)})
              print(label,chars,predicted,counted)
          result={'tokenizer':'o200k_base','method':'tiktoken.get_encoding(...).encode(text)','scope':'raw content only; excludes chat message wrappers, tool definitions, and provider overhead',
                  'rows':rows,'questions':{'largest_underestimate':max(rows,key=lambda r:r['ratio_counted_predicted'])['content'],
                  'spanish_minus_english':rows[2]['counted_tokens']-rows[1]['counted_tokens'],
                  'spanish_vs_english_percent':round((rows[2]['counted_tokens']/rows[1]['counted_tokens']-1)*100,2)}}
          Path('results').mkdir(exist_ok=True)
          Path('results/token_counts.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit measured evidence on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokenlab/results/token_counts.json
          git commit -m 'test(module1): record o200k_base tokenizer counts' || true
          git push origin HEAD:module1-token-lab-measure
